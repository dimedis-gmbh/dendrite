<!DOCTYPE html>
<html>
<head>
    <title>Dendrite Image Editor</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- TUI Image Editor CSS -->
    <link rel="stylesheet" href="/lib/tui-color-picker.min.css">
    <link rel="stylesheet" href="/lib/tui-image-editor.min.css">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        html, body { 
            height: 100%; 
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        
        #container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Header bar */
        #header-bar {
            background: linear-gradient(to bottom, #f8f8f8, #e8e8e8);
            border-bottom: 1px solid #d0d0d0;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 44px;
            position: relative;
        }
        
        #file-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        #filename {
            font-weight: 500;
            color: #333;
        }
        
        #modified-indicator {
            color: #ff6b6b;
            font-style: italic;
        }
        
        #modified-indicator.hidden {
            display: none;
        }
        
        #header-actions {
            display: flex;
            gap: 8px;
        }
        
        .header-btn {
            background: linear-gradient(to bottom, #ffffff, #f0f0f0);
            border: 1px solid #ccc;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 13px;
            color: #333;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .header-btn:hover {
            background: linear-gradient(to bottom, #f0f0ff, #e0e0ff);
            border-color: #0078d4;
        }
        
        /* Status message in header */
        #status-message {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: #28a745;
            color: white;
            padding: 6px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
        }
        
        #status-message.show {
            opacity: 1;
        }
        
        #status-message.fade-out {
            opacity: 0;
        }
        
        #status-message.error {
            background: #dc3545;
        }
        
        /* TUI Image Editor container */
        #tui-image-editor {
            flex: 1;
            min-height: 0;
        }
        
        /* Status bar */
        #status-bar {
            background: linear-gradient(to bottom, #f0f0f0, #e0e0e0);
            border-top: 1px solid #d0d0d0;
            padding: 4px 12px;
            font-size: 12px;
            color: #666;
            display: none; /* Hide for now as TUI has its own */
        }
        
        /* Hide TUI's built-in Load and Download buttons */
        .tui-image-editor-load-btn,
        .tui-image-editor-download-btn {
            display: none !important;
        }
        
        /* Hide controls above the image (zoom, undo/redo, delete, reset) */
        .tui-image-editor-header-logo,
        .tui-image-editor-header-buttons {
            display: none !important;
        }
        
        /* Keep the header but hide unwanted elements */
        .tui-image-editor-header {
            min-height: 0 !important;
            height: auto !important;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Custom header bar -->
        <div id="header-bar">
            <div id="file-info">
                <span id="filename">Untitled</span>
                <span id="modified-indicator" class="hidden">(Modified)</span>
            </div>
            <div id="status-message"></div>
            <div id="header-actions">
                <button id="save-btn" class="header-btn">💾 Save</button>
                <button id="revert-btn" class="header-btn">↺ Revert</button>
                <button id="close-btn" class="header-btn">✕ Close</button>
            </div>
        </div>
        
        <!-- TUI Image Editor -->
        <div id="tui-image-editor"></div>
        
        <!-- Status bar (hidden) -->
        <div id="status-bar"></div>
    </div>
    
    <!-- TUI Image Editor JavaScript -->
    <script src="/lib/fabric.min.js"></script>
    <script src="/lib/tui-color-picker.min.js"></script>
    <script src="/lib/tui-image-editor.min.js"></script>
    
    <!-- Our simple adapter -->
    <script src="/js/image-editor.js"></script>
</body>
</html>
